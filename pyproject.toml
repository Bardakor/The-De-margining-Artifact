[project]
name = "footy"
version = "0.1.0"
description = "Dixon-Coles football pricing core and de-margining artifact study apparatus (Plan 1: pure pricing/evaluation; empirical study not yet implemented)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = [
    "football",
    "Dixon-Coles",
    "bookmaker-margin",
    "forecast-evaluation",
    "research-reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=2.0", "scipy>=1.14"]

[project.urls]
Homepage = "https://github.com/Bardakor/betting-app-yami"
Repository = "https://github.com/Bardakor/betting-app-yami"
Documentation = "https://github.com/Bardakor/betting-app-yami/blob/main/docs/model.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footy"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "NPY"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
