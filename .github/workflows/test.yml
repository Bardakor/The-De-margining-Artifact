name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # These three services have no test or lint scripts, so this job verifies what
  # can actually be verified: that dependencies resolve and every source file
  # parses. Real tests land when the services are consolidated (rebuild spec 2.2).
  test-backend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        service: [fixtures-service, odds-service, main-service]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        # Single root lockfile: this is an npm workspaces monorepo and the
        # individual services have no lockfile of their own.
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Syntax check
      run: find backend/${{ matrix.service }}/src -name '*.js' -print0 | xargs -0 -n1 node --check

    - name: Run tests
      run: npm test --if-present --workspace=backend/${{ matrix.service }}

    - name: Lint code
      run: npm run lint --if-present --workspace=backend/${{ matrix.service }}

  test-quant-engine:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: packages/quant-engine/package-lock.json

    - name: Install dependencies
      working-directory: packages/quant-engine
      run: npm ci

    - name: Verify (typecheck + purity guard + tests)
      working-directory: packages/quant-engine
      run: npm run verify

  test-frontend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Next 16 requires Node >= 20.9, so 18.x is not a supported target.
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npx tsc --noEmit
      working-directory: frontend

    - name: Build frontend
      run: npm run build --workspace=frontend

    # Advisory, not blocking. The legacy frontend has 123 known lint findings
    # (53 errors: 42 no-explicit-any, 5 react-hooks/immutability,
    # 5 react/no-unescaped-entities, 1 react-hooks/set-state-in-effect; plus
    # 70 warnings, mostly unused vars). None are in the quant engine. This code
    # is replaced in stage 4 of the rebuild, so the findings are surfaced here
    # rather than either blocking the build or being silently suppressed.
    - name: Lint code (advisory)
      run: npm run lint --workspace=frontend
      continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Run npm audit on all services
      run: |
        cd backend/fixtures-service && npm audit --audit-level=high
        cd ../odds-service && npm audit --audit-level=high
        cd ../main-service && npm audit --audit-level=high
        cd ../../frontend && npm audit --audit-level=high 